<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Webカーナビ</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            color: #eee;
        }
        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .ui-container {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }
        .search-box {
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px;
            border-radius: 12px;
            display: flex;
            gap: 8px;
            pointer-events: auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .search-box input {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        .search-box input::placeholder {
            color: #888;
        }
        .search-box button {
            background: #007aff;
            color: #fff;
            border: none;
            padding: 0 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }
        .search-box button:active {
            background: #0056b3;
        }
        .info-panel {
            position: absolute;
            bottom: 25px;
            left: 15px;
            right: 15px;
            z-index: 10;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 16px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 25px rgba(0,0,0,0.6);
            pointer-events: auto;
        }
        .info-content {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .info-title {
            font-size: 13px;
            color: #aaa;
        }
        .info-value {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
        }
        .gps-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 10px rgba(40, 167, 69, 0.4);
        }
        .gps-btn.active {
            background: #dc3545;
            box-shadow: 0 2px 10px rgba(220, 53, 69, 0.4);
        }
        .leaflet-control-zoom {
            display: none;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="ui-container">
        <div class="search-box">
            <input type="text" id="destinationInput" placeholder="目的地を検索 (例: 東京駅、新宿)">
            <button id="searchBtn">検索</button>
        </div>
    </div>

    <div class="info-panel">
        <div class="info-content">
            <span class="info-title">自車位置GPSステータス</span>
            <span class="info-value" id="gpsStatus">待機中...</span>
        </div>
        <button class="gps-btn" id="gpsToggleBtn">GPS追従開始</button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        const map = L.map('map', {
            zoomControl: false,
            attributionControl: false
        }).setView([35.485, 139.403], 15);

        // 国土地理院の標準地図タイルに変更（APIキー不要・商用/個人利用制限なしで安定）
        L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
            maxZoom: 18,
            minZoom: 2
        }).addTo(map);

        let userMarker = null;
        let accuracyCircle = null;
        let watchId = null;
        let isTracking = false;
        let destMarker = null;

        const gpsStatusElem = document.getElementById('gpsStatus');
        const gpsToggleBtn = document.getElementById('gpsToggleBtn');

        function updatePosition(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const accuracy = position.coords.accuracy;
            const speed = position.coords.speed ? (position.coords.speed * 3.6).toFixed(1) : 0;

            const latlng = [lat, lng];

            if (!userMarker) {
                userMarker = L.circleMarker(latlng, {
                    radius: 9,
                    fillColor: '#007aff',
                    color: '#ffffff',
                    weight: 3,
                    opacity: 1,
                    fillOpacity: 1
                }).addTo(map);

                accuracyCircle = L.circle(latlng, {
                    radius: accuracy,
                    color: '#007aff',
                    fillColor: '#007aff',
                    fillOpacity: 0.15,
                    weight: 1
                }).addTo(map);
            } else {
                userMarker.setLatLng(latlng);
                accuracyCircle.setLatLng(latlng);
                accuracyCircle.setRadius(accuracy);
            }

            if (isTracking) {
                map.setView(latlng, 17, { animate: true });
            }

            gpsStatusElem.innerText = `精度: ${Math.round(accuracy)}m / ${speed} km/h`;
        }

        function onGpsError(error) {
            console.error(error);
            let msg = "GPS取得エラー";
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    msg = "位置情報の利用が拒否されました";
                    break;
                case error.POSITION_UNAVAILABLE:
                    msg = "位置情報が取得できません";
                    break;
                case error.TIMEOUT:
                    msg = "タイムアウトしました";
                    break;
            }
            gpsStatusElem.innerText = msg;
        }

        gpsToggleBtn.addEventListener('click', () => {
            if (!isTracking) {
                if ("geolocation" in navigator) {
                    gpsStatusElem.innerText = "GPS取得中...";
                    watchId = navigator.geolocation.watchPosition(updatePosition, onGpsError, {
                        enableHighAccuracy: true,
                        maximumAge: 0,
                        timeout: 10000
                    });
                    isTracking = true;
                    gpsToggleBtn.innerText = "追従停止";
                    gpsToggleBtn.classList.add('active');
                } else {
                    alert("お使いのブラウザは位置情報に対応していません。");
                }
            } else {
                if (watchId !== null) {
                    navigator.geolocation.clearWatch(watchId);
                    watchId = null;
                }
                isTracking = false;
                gpsToggleBtn.innerText = "GPS追従開始";
                gpsToggleBtn.classList.remove('active');
                gpsStatusElem.innerText = "停止中";
            }
        });

        document.getElementById('searchBtn').addEventListener('click', searchDestination);
        document.getElementById('destinationInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchDestination();
        });

        function searchDestination() {
            const query = document.getElementById('destinationInput').value;
            if (!query) return;

            gpsStatusElem.innerText = "検索中...";
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data && data.length > 0) {
                        const lat = parseFloat(data[0].lat);
                        const lon = parseFloat(data[0].lon);
                        const destLatLng = [lat, lon];

                        if (destMarker) {
                            map.removeLayer(destMarker);
                        }

                        destMarker = L.marker(destLatLng).addTo(map)
                            .bindPopup(`<b>${data[0].display_name}</b>`).openPopup();

                        map.setView(destLatLng, 15, { animate: true });
                        gpsStatusElem.innerText = "目的地を設定しました";
                    } else {
                        alert("見つかりませんでした");
                        gpsStatusElem.innerText = "検索失敗";
                    }
                })
                .catch(err => {
                    console.error(err);
                    alert("検索エラーが発生しました");
                    gpsStatusElem.innerText = "エラー";
                });
        }
    </script>
</body>
</html>
